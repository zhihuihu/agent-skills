openapi: 3.0.3
info:
  title: Swagger Petstore - Sample
  description: 供 openapi-explorer 技能测试与演示用的精简 API 规范
  version: 1.0.0
servers:
  - url: https://petstore.example.com/api/v1
paths:
  /pets:
    get:
      summary: 列出所有宠物
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: 返回结果数量上限
          required: false
          schema:
            type: integer
            format: int32
        - name: status
          in: query
          description: 按状态筛选
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        '200':
          description: 宠物列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: 创建新宠物
      operationId: createPet
      tags:
        - pets
      requestBody:
        description: 待创建的宠物信息
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: 请求参数错误
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: 宠物的数字 ID
        schema:
          type: integer
          format: int64
    get:
      summary: 根据 ID 获取指定宠物
      operationId: getPetById
      tags:
        - pets
      responses:
        '200':
          description: 宠物信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: 宠物未找到
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        tag:
          type: string
        category:
          $ref: '#/components/schemas/Category'
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
